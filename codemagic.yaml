workflows:
  ios-workflow:
    name: Shield IPTV Player iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: latest
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Sync iOS platform
        script: |
          npm run sync:ios
      - name: Set up code signing
        script: |
          # Installs profiles and certificates configured in Codemagic UI
          xcode-project use-profiles
      - name: Build IPA (Real Device)
        script: |
          # Compiles the Xcode project and generates the .ipa file
          # Note: This will succeed if Code Signing is set up in Codemagic UI
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
