<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldIPTV Logo</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Material+Icons&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --accent: #8b5cf6;
            --bg-base: #05070a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05070a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            color: #ffffff;
            user-select: none;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            text-decoration: none;
            color: white;
            animation: fadeIn 1s ease-out;
        }

        .logo-icon {
            font-size: 7.5rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.25));
        }

        .logo h1 {
            font-size: 5.5rem;
            font-weight: 700;
            letter-spacing: -1.5px;
            margin: 0;
            line-height: 1;
        }

        .logo h1 span {
            color: var(--primary);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.96);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="logo">
        <span class="material-icons logo-icon">shield</span>
        <h1>Shield<span>IPTV</span></h1>
    </div>

</body>
</html>
