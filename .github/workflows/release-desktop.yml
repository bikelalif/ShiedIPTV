name: Build and Release Desktop Clients

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mac/package.json

      - name: Sync Web Assets
        run: node scripts/sync-platforms.js --platform mac

      - name: Install Dependencies
        run: |
          cd mac
          npm install

      - name: Build macOS DMG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd mac
          npm run dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: mac/dist/*.dmg

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: pc/package.json

      - name: Sync Web Assets
        run: node scripts/sync-platforms.js --platform pc

      - name: Install Dependencies
        run: |
          cd pc
          npm install

      - name: Build Windows EXE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd pc
          npm run dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: pc/dist/*.exe

  create-release:
    name: Create GitHub Release
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: ./dist

      - name: Download Windows EXE Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/*.dmg
            ./dist/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
